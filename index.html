<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票分析智能体 - Stock Analysis Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }
        
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            margin-top: 20px;
        }
        
        .result-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .result-label {
            font-weight: 600;
            color: #333;
            font-size: 0.9em;
            text-transform: uppercase;
        }
        
        .result-value {
            font-size: 1.3em;
            color: #667eea;
            margin-top: 5px;
        }
        
        .recommendation {
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            font-weight: 700;
            font-size: 1.2em;
            margin: 15px 0;
        }
        
        .recommendation.BUY {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        
        .recommendation.SELL {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        
        .recommendation.HOLD {
            background: #fff3cd;
            color: #856404;
            border: 2px solid #ffc107;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }
        
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }
        
        .tab-btn {
            background: none;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            color: #666;
            font-weight: 600;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .portfolio-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        
        .stock-symbol {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1em;
        }
        
        .price-up {
            color: #28a745;
        }
        
        .price-down {
            color: #dc3545;
        }
        
        footer {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: #666;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 股票分析智能体</h1>
            <p class="subtitle">AI-Powered Stock Analysis Agent - 实时数据分析 & 智能推荐</p>
        </header>
        
        <div class="main-content">
            <!-- 左侧: 单只股票分析 -->
            <div class="card">
                <h2>📊 单只股票分析</h2>
                
                <div class="input-group">
                    <label for="symbol">股票代码</label>
                    <input type="text" id="symbol" placeholder="例如: AAPL, MSFT, GOOGL" value="AAPL">
                </div>
                
                <div class="input-group">
                    <label for="period">数据周期</label>
                    <select id="period">
                        <option value="1mo">1个月</option>
                        <option value="3mo" selected>3个月</option>
                        <option value="6mo">6个月</option>
                        <option value="1y">1年</option>
                    </select>
                </div>
                
                <button onclick="analyzeStock()">🔍 分析股票</button>
                
                <div class="loading" id="loading1">
                    <div class="spinner"></div>
                    <p>分析中...</p>
                </div>
                
                <div id="stockResult"></div>
            </div>
            
            <!-- 右侧: 投资组合分析 -->
            <div class="card">
                <h2>💼 投资组合分析</h2>
                
                <div class="input-group">
                    <label for="portfolio">股票列表 (逗号分隔)</label>
                    <input type="text" id="portfolio" placeholder="例如: AAPL,MSFT,GOOGL,TSLA" value="AAPL,MSFT,GOOGL">
                </div>
                
                <button onclick="analyzePortfolio()">📈 分析组合</button>
                
                <div class="loading" id="loading2">
                    <div class="spinner"></div>
                    <p>分析中...</p>
                </div>
                
                <div id="portfolioResult"></div>
            </div>
        </div>
        
        <!-- 价格告警管理 -->
        <div class="card" style="margin-bottom: 30px;">
            <h2>🔔 价格告警管理</h2>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab(event, 'create-alert')">创建告警</button>
                <button class="tab-btn" onclick="switchTab(event, 'view-alerts')">查看告警</button>
            </div>
            
            <!-- 创建告警 -->
            <div id="create-alert" class="tab-content active">
                <div class="grid-2">
                    <div class="input-group">
                        <label for="alertSymbol">股票代码</label>
                        <input type="text" id="alertSymbol" placeholder="例如: AAPL" value="AAPL">
                    </div>
                    
                    <div class="input-group">
                        <label for="alertType">告警类型</label>
                        <select id="alertType">
                            <option value="above">价格上升至</option>
                            <option value="below">价格下降至</option>
                        </select>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="alertPrice">目标价格</label>
                    <input type="number" id="alertPrice" placeholder="150.00" step="0.01" value="150.00">
                </div>
                
                <button onclick="createAlert()">创建告警</button>
                
                <div id="alertCreateResult" style="margin-top: 20px;"></div>
            </div>
            
            <!-- 查看告警 -->
            <div id="view-alerts" class="tab-content">
                <button onclick="getAlerts()">🔄 刷新告警列表</button>
                <div id="alertsList" style="margin-top: 20px;"></div>
            </div>
        </div>
        
        <!-- 情绪分析 -->
        <div class="card" style="margin-bottom: 30px;">
            <h2>📰 新闻情绪分析</h2>
            
            <div class="input-group">
                <label for="sentimentSymbol">股票代码</label>
                <input type="text" id="sentimentSymbol" placeholder="例如: AAPL" value="AAPL">
            </div>
            
            <button onclick="getSentiment()">分析情绪</button>
            
            <div class="loading" id="loading3">
                <div class="spinner"></div>
                <p>分析中...</p>
            </div>
            
            <div id="sentimentResult"></div>
        </div>
        
        <footer>
            <p>⚠️ 免责声明: 本工具仅供教育和参考之用，不构成投资建议。股票交易涉及风险，请谨慎决策。</p>
            <p>© 2024 Stock Analysis Agent | Powered by FastAPI & AI</p>
        </footer>
    </div>
    
    <script>
        const API_BASE = 'http://localhost:8000/api/v1';
        
        // 分析单只股票
        async function analyzeStock() {
            const symbol = document.getElementById('symbol').value.toUpperCase();
            const period = document.getElementById('period').value;
            
            if (!symbol) {
                alert('请输入股票代码');
                return;
            }
            
            showLoading('loading1');
            
            try {
                // 获取推荐
                const response = await axios.get(`${API_BASE}/recommendation/${symbol}?period=${period}`);
                const data = response.data;
                
                let html = '<div class="result">';
                
                // 推荐
                html += `<div class="recommendation ${data.recommendation}">${data.recommendation}</div>`;
                
                // 关键数据
                html += `
                    <div class="result-item">
                        <div class="result-label">当前价格</div>
                        <div class="result-value">$${data.current_price.toFixed(2)}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">置信度</div>
                        <div class="result-value">${(data.confidence * 100).toFixed(1)}%</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">目标价格</div>
                        <div class="result-value">$${data.target_price.toFixed(2)}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">止损价格</div>
                        <div class="result-value">$${data.stop_loss.toFixed(2)}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">风险级别</div>
                        <div class="result-value">${data.risk_level}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">分析总结</div>
                        <div style="margin-top: 10px; color: #666;">${data.analysis.summary}</div>
                    </div>
                `;
                
                html += '</div>';
                document.getElementById('stockResult').innerHTML = html;
            } catch (error) {
                document.getElementById('stockResult').innerHTML = `<div class="error">错误: ${error.response?.data?.detail || error.message}</div>`;
            }
            
            hideLoading('loading1');
        }
        
        // 分析投资组合
        async function analyzePortfolio() {
            const symbols = document.getElementById('portfolio').value.split(',').map(s => s.trim().toUpperCase());
            
            if (symbols.length === 0) {
                alert('请输入至少一个股票代码');
                return;
            }
            
            showLoading('loading2');
            
            try {
                const response = await axios.post(`${API_BASE}/analyze-portfolio`, {
                    symbols: symbols,
                    include_sentiment: true
                });
                
                const data = response.data;
                let html = '<div class="result">';
                
                // 摘要
                html += `
                    <div class="grid-2">
                        <div class="result-item">
                            <div class="result-label">买入信号</div>
                            <div class="result-value" style="color: #28a745;">${data.summary.buy_count}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">卖出信号</div>
                            <div class="result-value" style="color: #dc3545;">${data.summary.sell_count}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">持有信号</div>
                            <div class="result-value" style="color: #ffc107;">${data.summary.hold_count}</div>
                        </div>
                        <div class="result-item">
                            <div class="result-label">分析股票数</div>
                            <div class="result-value">${data.analyzed_stocks}/${data.total_stocks}</div>
                        </div>
                    </div>
                `;
                
                // 详细信息
                html += '<h3 style="margin-top: 20px; color: #333;">📋 详细分析</h3>';
                data.stocks.forEach(stock => {
                    html += `
                        <div class="portfolio-item">
                            <div class="stock-symbol">${stock.symbol}</div>
                            <div style="margin-top: 10px;">
                                <strong>推荐:</strong> <span class="recommendation ${stock.recommendation}" style="display: inline-block; padding: 5px 15px; border-radius: 3px; font-size: 0.9em;">${stock.recommendation}</span>
                            </div>
                            <div style="margin-top: 8px;">
                                <strong>置信度:</strong> ${(stock.confidence * 100).toFixed(1)}% | 
                                <strong>风险:</strong> ${stock.risk_level}
                            </div>
                        </div>
                    `;
                });
                
                html += '</div>';
                document.getElementById('portfolioResult').innerHTML = html;
            } catch (error) {
                document.getElementById('portfolioResult').innerHTML = `<div class="error">错误: ${error.response?.data?.detail || error.message}</div>`;
            }
            
            hideLoading('loading2');
        }
        
        // 创建告警
        async function createAlert() {
            const symbol = document.getElementById('alertSymbol').value.toUpperCase();
            const alertType = document.getElementById('alertType').value;
            const targetPrice = parseFloat(document.getElementById('alertPrice').value);
            
            if (!symbol || !targetPrice) {
                alert('请填写所有字段');
                return;
            }
            
            try {
                const response = await axios.post(`${API_BASE}/alerts`, {
                    symbol: symbol,
                    alert_type: alertType,
                    target_price: targetPrice
                });
                
                document.getElementById('alertCreateResult').innerHTML = `
                    <div class="success">
                        ✅ 告警创建成功！<br>
                        告警ID: ${response.data.alert_id}<br>
                        ${symbol} ${alertType === 'above' ? '涨至' : '跌至'} $${targetPrice.toFixed(2)}
                    </div>
                `;
                
                // 清空表单
                document.getElementById('alertPrice').value = '';
                
                // 刷新告警列表
                setTimeout(getAlerts, 1000);
            } catch (error) {
                document.getElementById('alertCreateResult').innerHTML = `<div class="error">错误: ${error.response?.data?.detail || error.message}</div>`;
            }
        }
        
        // 获取所有告警
        async function getAlerts() {
            try {
                const response = await axios.get(`${API_BASE}/alerts`);
                const alerts = response.data;
                
                if (alerts.length === 0) {
                    document.getElementById('alertsList').innerHTML = '<p style="color: #666;">暂无告警</p>';
                    return;
                }
                
                let html = '';
                alerts.forEach(alert => {
                    html += `
                        <div class="portfolio-item">
                            <div class="stock-symbol">${alert.symbol}</div>
                            <div style="margin-top: 8px;">
                                <strong>${alert.alert_type === 'above' ? '📈 涨至' : '📉 跌至'}:</strong> $${alert.target_price.toFixed(2)}
                            </div>
                            <div style="margin-top: 8px; color: #999; font-size: 0.9em;">
                                创建于: ${new Date(alert.created_at).toLocaleString()}
                            </div>
                            <button onclick="deleteAlert('${alert.alert_id}')" style="margin-top: 10px; background: #dc3545; padding: 8px 15px; font-size: 0.9em;">删除</button>
                        </div>
                    `;
                });
                
                document.getElementById('alertsList').innerHTML = html;
            } catch (error) {
                document.getElementById('alertsList').innerHTML = `<div class="error">错误: ${error.response?.data?.detail || error.message}</div>`;
            }
        }
        
        // 删除告警
        async function deleteAlert(alertId) {
            try {
                await axios.delete(`${API_BASE}/alerts/${alertId}`);
                getAlerts();
            } catch (error) {
                alert('删除失败: ' + (error.response?.data?.detail || error.message));
            }
        }
        
        // 获取情绪分析
        async function getSentiment() {
            const symbol = document.getElementById('sentimentSymbol').value.toUpperCase();
            
            if (!symbol) {
                alert('请输入股票代码');
                return;
            }
            
            showLoading('loading3');
            
            try {
                const response = await axios.get(`${API_BASE}/sentiment/${symbol}`);
                const data = response.data;
                const sentiment = data.sentiment;
                
                let html = '<div class="result">';
                
                // 总体情绪
                let sentimentColor = '#ffc107';
                if (sentiment.sentiment === 'POSITIVE') sentimentColor = '#28a745';
                else if (sentiment.sentiment === 'NEGATIVE') sentimentColor = '#dc3545';
                
                html += `
                    <div style="background: ${sentimentColor}; color: white; padding: 20px; border-radius: 5px; text-align: center; margin-bottom: 20px;">
                        <div style="font-size: 2em; font-weight: 700;">${sentiment.sentiment}</div>
                        <div style="font-size: 1.2em; margin-top: 10px;">得分: ${sentiment.score.toFixed(2)}</div>
                    </div>
                `;
                
                // 文章列表
                html += `<div style="font-size: 0.9em; color: #666;">分析了 ${sentiment.article_count} 篇新闻文章</div>`;
                
                if (sentiment.articles && sentiment.articles.length > 0) {
                    html += '<div style="margin-top: 15px;">';
                    sentiment.articles.forEach((article, idx) => {
                        html += `
                            <div class="portfolio-item">
                                <strong>${idx + 1}. ${article.title}</strong>
                                <div style="margin-top: 8px; font-size: 0.9em; color: #666;">
                                    来源: ${article.source} | 情绪: <span style="font-weight: 600; color: ${article.sentiment === 'POSITIVE' ? '#28a745' : article.sentiment === 'NEGATIVE' ? '#dc3545' : '#ffc107'};">${article.sentiment}</span>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                
                html += '</div>';
                document.getElementById('sentimentResult').innerHTML = html;
            } catch (error) {
                document.getElementById('sentimentResult').innerHTML = `<div class="error">错误: ${error.response?.data?.detail || error.message}</div>`;
            }
            
            hideLoading('loading3');
        }
        
        // 辅助函数
        function showLoading(id) {
            document.getElementById(id).classList.add('active');
        }
        
        function hideLoading(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        function switchTab(event, tabId) {
            // 隐藏所有tab内容
            document.querySelectorAll('.tab-content').forEach(el => {
                el.classList.remove('active');
            });
            
            // 移除所有tab按钮的active类
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });
            
            // 显示选中的tab
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
        
        // 页面加载时获取告警
        window.addEventListener('load', () => {
            getAlerts();
        });
    </script>
</body>
</html>
